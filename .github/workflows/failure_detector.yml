name: Failure Detector

on:
  workflow_run:
    workflows:
      - "VowOS Production Certification"
      - "VowOS Post-Deploy Smoke"
    types:
      - completed

jobs:
  detect-and-report:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Extract Logs and Fingerprint
        id: fingerprint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Extracting logs for workflow run ${{ github.event.workflow_run.id }}"
          
          # Mock the fingerprint extraction for Phase 2
          FINGERPRINT="ERR_CI_DEPENDENCY_FAILURE"
          echo "fingerprint=$FINGERPRINT" >> $GITHUB_OUTPUT
          
          # Construct JSON payload for platform_delivery_incidents
          cat <<EOF > payload.json
          {
            "incident_type": "ci_failure",
            "workflow_name": "${{ github.event.workflow_run.name }}",
            "run_id": "${{ github.event.workflow_run.id }}",
            "fingerprint": "$FINGERPRINT",
            "commit_sha": "${{ github.event.workflow_run.head_sha }}",
            "branch": "${{ github.event.workflow_run.head_branch }}",
            "repository": "${{ github.repository }}"
          }
          EOF
          
          echo "Generated Payload:"
          cat payload.json

      - name: Push to VowOS platform_delivery_incidents
        run: |
          echo "Pushing incident payload to VowOS incident table webhook..."
          # Mock webhook push
          curl -X POST -H "Content-Type: application/json" -d @payload.json https://mock-vowos-webhook.local/incident || echo "Webhook mock push complete."
