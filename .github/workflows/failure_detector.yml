name: Failure Detector

on:
  workflow_run:
    workflows:
      - "VowOS Production Certification"
      - "VowOS Post-Deploy Smoke"
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  detect-and-report:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
      WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      REPOSITORY_NAME: ${{ github.repository }}
    steps:
      - name: Record failed workflow incident
        id: fingerprint
        shell: bash
        run: |
          set -euo pipefail
          FINGERPRINT="ERR_CI_WORKFLOW_FAILURE"
          printf 'fingerprint=%s\n' "$FINGERPRINT" >> "$GITHUB_OUTPUT"

          jq -n \
            --arg incident_type "ci_failure" \
            --arg workflow_name "$WORKFLOW_NAME" \
            --arg run_id "$WORKFLOW_RUN_ID" \
            --arg fingerprint "$FINGERPRINT" \
            --arg commit_sha "$WORKFLOW_HEAD_SHA" \
            --arg branch "$WORKFLOW_HEAD_BRANCH" \
            --arg repository "$REPOSITORY_NAME" \
            '{incident_type:$incident_type,workflow_name:$workflow_name,run_id:$run_id,fingerprint:$fingerprint,commit_sha:$commit_sha,branch:$branch,repository:$repository}' \
            > payload.json

          {
            echo "## VowOS workflow failure detected"
            echo
            echo "- Workflow: \`$WORKFLOW_NAME\`"
            echo "- Run: \`$WORKFLOW_RUN_ID\`"
            echo "- Commit: \`$WORKFLOW_HEAD_SHA\`"
            echo "- Branch: \`$WORKFLOW_HEAD_BRANCH\`"
            echo "- Fingerprint: \`$FINGERPRINT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve incident payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failure-incident-${{ github.event.workflow_run.id }}
          path: payload.json
          if-no-files-found: error
          retention-days: 14
