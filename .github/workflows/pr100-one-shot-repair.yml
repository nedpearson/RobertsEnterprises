name: PR100 One-Shot Source Repair

on:
  push:
    branches:
      - fix/shopify-production-complete
    paths:
      - scripts/repair-pr100-typecheck.py
      - .github/workflows/pr100-one-shot-repair.yml

permissions:
  contents: write

concurrency:
  group: pr100-one-shot-source-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/shopify-production-complete
          fetch-depth: 0

      - name: Apply asserted source repairs
        run: python3 scripts/repair-pr100-typecheck.py

      - name: Verify patch integrity
        run: git diff --check

      - name: Remove one-shot repair machinery
        run: |
          rm scripts/repair-pr100-typecheck.py
          rm .github/workflows/pr100-one-shot-repair.yml

      - name: Commit repaired source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "VowOS Repair Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Repair canonical VowOS type contracts"
          git push origin HEAD:fix/shopify-production-complete
