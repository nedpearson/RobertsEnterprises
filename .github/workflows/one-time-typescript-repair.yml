name: One-time TypeScript Repair

on:
  push:
    branches:
      - fix/shopify-production-complete

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/fix/shopify-production-complete' && github.event.head_commit.message == 'Run controlled TypeScript repair pass'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/shopify-production-complete
          persist-credentials: true

      - name: Apply deterministic repair script
        run: node scripts/one-time-typescript-repair.mjs

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit deterministic repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair changes were necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/marketing/src
          git commit -m "[auto-fix] apply deterministic TypeScript repairs"
          git push origin HEAD:fix/shopify-production-complete
