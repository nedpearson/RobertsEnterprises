name: VowOS Production Certification

on:
  push:
    branches: [main, consolidation-vowos]
  pull_request:
    branches: [main, consolidation-vowos]

jobs:
  full-certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install -f @rollup/rollup-linux-x64-gnu @swc/core-linux-x64-gnu --no-save

      - name: Tenant isolation guard
        run: node scripts/tenant-isolation-guard.mjs

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Certify VowOS monorepo
        run: npm run certify
        env:
          VITE_SUPABASE_URL: https://demo.invalid
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Upload design guard report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: design-guard-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  test-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: v2.75.0
      - name: Start Supabase locally (Tests all migrations apply cleanly)
        run: supabase start
        working-directory: ./apps/marketing

  deploy-migrations:
    needs: [full-certify, test-migrations]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: v2.75.0
      - name: Link and Push migrations to production
        run: |
          supabase link --project-ref yyexmcaumkzxvhplipkl
          supabase db push --include-all
        working-directory: ./apps/marketing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  certify-gate:
    if: always()
    needs: [full-certify, test-migrations]
    runs-on: ubuntu-latest
    steps:
      - name: Assert all required jobs succeeded
        run: |
          if [ "${{ needs.full-certify.result }}" != "success" ] || [ "${{ needs.test-migrations.result }}" != "success" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All checks passed. Ready for deployment."
