name: VowOS Production Certification

on:
  push:
    branches: [main, consolidation-vowos]
  pull_request:
    branches: [main, consolidation-vowos]

jobs:
  full-certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npm install -f @rollup/rollup-linux-x64-gnu @swc/core-linux-x64-gnu --no-save

      - name: Validate Railway runtime supervisor
        run: node --check start-selector.js

      - name: Certify VowOS web application
        run: npm run certify
        working-directory: ./apps/marketing

      - name: Build VowOS worker/API
        run: npm run build --workspace worker

      - name: Test VowOS worker/API
        run: npm run test --workspace worker

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Design and interaction guard (e2e against the production runtime)
        run: npm run test:guard
        env:
          VITE_SUPABASE_URL: https://demo.invalid
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Upload guard report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: design-guard-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  test-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: v2.75.0
      - name: Start Supabase locally (replay every migration)
        run: supabase start
        working-directory: ./apps/marketing
      - name: Verify organization-brand-location persistence contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/brand_scope_contract.sql
        working-directory: ./apps/marketing

  deploy-migrations:
    needs: [full-certify, test-migrations]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: v2.75.0
      - name: Link and Push migrations to production
        run: |
          supabase link --project-ref yyexmcaumkzxvhplipkl
          supabase db push --include-all
        working-directory: ./apps/marketing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  certify-gate:
    if: always()
    needs: [full-certify, test-migrations]
    runs-on: ubuntu-latest
    steps:
      - name: Assert all required jobs succeeded
        run: |
          if [ "${{ needs.full-certify.result }}" != "success" ] || [ "${{ needs.test-migrations.result }}" != "success" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All checks passed. Ready for deployment."
