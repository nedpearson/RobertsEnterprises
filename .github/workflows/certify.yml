name: VowOS Production Certification

on:
  push:
    branches: [main, consolidation-vowos]
  pull_request:
    branches: [main, consolidation-vowos]

jobs:
  full-certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Full Certification (Lint, Typecheck, Unit, Build)
        run: npm run certify
        working-directory: ./apps/marketing
        # This orchestrates the entire certification suite strictly.
