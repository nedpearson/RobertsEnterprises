name: VowOS Production Certification

on:
  push:
    branches: [main, consolidation-vowos]
  pull_request:
    branches: [main, consolidation-vowos]

jobs:
  full-certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npm install -f @rollup/rollup-linux-x64-gnu @swc/core-linux-x64-gnu --no-save

      - name: Validate Railway runtime supervisor
        run: node --check start-selector.js

      - name: Certify VowOS web application
        run: npm run certify
        working-directory: ./apps/marketing

      - name: Build VowOS worker/API
        run: npm run build --workspace worker

      - name: Test VowOS worker/API
        run: npm run test --workspace worker

      - name: Verify live Roberts Shopify setup readiness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 'https://api.robertsenterprises.bridgebox.ai/api/shopify/setup/status' >/tmp/shopify.json
          cat /tmp/shopify.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/shopify.json','utf8')); if(x.ready!==true||x.redirectUriValid!==true||(Array.isArray(x.missing)&&x.missing.length)){console.error('Live Shopify setup is not production-ready',x);process.exit(1)}"

      # Design guard: boots the real Railway runtime (start-selector.js -> worker
      # :8082 + apps/marketing server.js :8080) and asserts the dashboard actually
      # renders. certify covers "does it compile"; post-deploy-smoke covers "did it
      # 200 after deploy". This covers "did the UI survive", before merge.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Design guard (e2e against the production runtime)
        run: npm run test:guard
        env:
          VITE_SUPABASE_URL: https://demo.invalid
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Upload design guard report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: design-guard-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  test-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: v2.75.0
      - name: Start Supabase locally (Tests all migrations apply cleanly)
        run: supabase start
        working-directory: ./apps/marketing

  deploy-migrations:
    needs: [full-certify, test-migrations]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: v2.75.0
      - name: Link and Push migrations to production
        run: |
          supabase link --project-ref yyexmcaumkzxvhplipkl 
          supabase db push --include-all
        working-directory: ./apps/marketing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  certify-gate:
    if: always()
    needs: [full-certify, test-migrations]
    runs-on: ubuntu-latest
    steps:
      - name: Assert all required jobs succeeded
        run: |
          if [ "${{ needs.full-certify.result }}" != "success" ] || [ "${{ needs.test-migrations.result }}" != "success" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All checks passed. Ready for deployment."

