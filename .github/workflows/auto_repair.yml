name: Antigravity Auto-Repair

on:
  workflow_dispatch:
    inputs:
      failing_commit:
        description: "The commit SHA that failed CI"
        required: true
      branch_name:
        description: "The branch where the failure occurred"
        required: true
      error_fingerprint:
        description: "The extracted error fingerprint"
        required: true
  repository_dispatch:
    types: [trigger-auto-repair]

jobs:
  repair:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.failing_commit || github.event.inputs.failing_commit }}
          fetch-depth: 0

      - name: Create isolated worktree branch
        run: |
          COMMIT_SHA="${{ github.event.client_payload.failing_commit || github.event.inputs.failing_commit }}"
          BRANCH_NAME="auto-repair-$COMMIT_SHA"
          git checkout -b "$BRANCH_NAME"
          echo "Created branch $BRANCH_NAME"
          echo "REPAIR_BRANCH=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Invoke Antigravity CLI for Repair
        run: |
          echo "Invoking agy headless mode for repair..."
          FINGERPRINT="${{ github.event.client_payload.error_fingerprint || github.event.inputs.error_fingerprint }}"
          agy -p "The CI failed with fingerprint $FINGERPRINT. Please analyze the codebase, fix the error, and ensure tests pass. Do not wait for user input." --headless
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Validate Fix
        run: |
          npm install
          npm run certify
        working-directory: ./apps/marketing
          
      - name: Commit and Open Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Antigravity Auto-Repair"
          git config --global user.email "bot@antigravity.local"
          git add .
          git commit -m "Auto-repair for commit ${{ github.event.client_payload.failing_commit || github.event.inputs.failing_commit }}" || echo "No changes to commit"
          git push -u origin ${{ env.REPAIR_BRANCH }}
          
          gh pr create --title "Auto-repair: Fix CI failure in ${{ github.event.client_payload.failing_commit || github.event.inputs.failing_commit }}" \
                       --body "This PR was automatically generated by Antigravity to fix the CI failure associated with fingerprint ${{ github.event.client_payload.error_fingerprint || github.event.inputs.error_fingerprint }}." \
                       --base main \
                       --head ${{ env.REPAIR_BRANCH }}
