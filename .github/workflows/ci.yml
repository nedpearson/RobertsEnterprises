name: CI Fast Gate

on:
  pull_request:
    branches: [main, consolidation-vowos]

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Audit dependencies for high/critical vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true # Keep non-blocking for now, dependabot will flag

      - name: Run lint
        run: npm run lint
        working-directory: ./apps/marketing
        # No continue-on-error: true. Lint gate MUST pass.

      - name: Typecheck
        run: npm run typecheck
        working-directory: ./apps/marketing
        # No continue-on-error: true. Typecheck MUST pass.

      - name: Unit & Integration Tests (Vitest)
        run: npm run test:unit
        working-directory: ./apps/marketing
        # No continue-on-error: true. Tests MUST pass.
