name: CI Fast Gate

on:
  pull_request:
    branches: [main, consolidation-vowos]

permissions:
  contents: read

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies for high/critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Audit production dependencies for high/critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Run lint
        run: npm run lint
        working-directory: ./apps/marketing

      - name: Typecheck
        run: npm run typecheck
        working-directory: ./apps/marketing

      - name: Unit & Integration Tests (Vitest)
        run: npm run test:unit
        working-directory: ./apps/marketing
