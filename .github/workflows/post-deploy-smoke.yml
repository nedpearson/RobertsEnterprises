name: VowOS Post-Deploy Smoke

on:
  deployment_status:

permissions:
  contents: read

jobs:
  production-smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Roberts Enterprise / production'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify unified readiness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 https://vowos.bridgebox.ai/api/health/unified >/tmp/health.json
          cat /tmp/health.json

      - name: Verify VowOS public website
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 --output /dev/null 'https://vowos.bridgebox.ai/'

      - name: Verify guided demo route
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 --output /dev/null 'https://vowos.bridgebox.ai/demo'

      - name: Verify full anonymous demo app route
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 --output /dev/null 'https://vowos.bridgebox.ai/demoapp'

      - name: Verify platform route
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 --output /dev/null 'https://vowos.bridgebox.ai/platform'

      - name: Assert guided demo remains on the canonical public origin
        run: |
          set -euo pipefail
          effective_url=$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 --location --output /dev/null --write-out '%{url_effective}' \
            'https://vowos.bridgebox.ai/demo')
          echo "Effective guided demo URL: $effective_url"
          case "$effective_url" in
            https://vowos.bridgebox.ai/demo*) ;;
            *) echo "Guided demo escaped canonical VowOS URL" >&2; exit 1 ;;
          esac

      # /demoapp is served on the canonical origin. It must NOT redirect to any
      # *.vowos.bridgebox.ai subdomain — no DNS exists there (NXDOMAIN), which is
      # exactly how the live demo went dark in August 2026.
      - name: Assert live demo app is served on the canonical origin
        run: |
          set -euo pipefail
          effective_url=$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 --location --output /dev/null --write-out '%{url_effective}' \
            'https://vowos.bridgebox.ai/demoapp')
          echo "Effective demoapp URL: $effective_url"
          case "$effective_url" in
            https://vowos.bridgebox.ai/demoapp*) ;;
            *) echo "Live demo app left the canonical origin (got: $effective_url)" >&2; exit 1 ;;
          esac

      - name: Assert public app alias enters demoapp on the canonical origin
        run: |
          set -euo pipefail
          effective_url=$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 --location --output /dev/null --write-out '%{url_effective}' \
            'https://vowos.bridgebox.ai/app')
          echo "Effective /app URL: $effective_url"
          case "$effective_url" in
            https://vowos.bridgebox.ai/demoapp*) ;;
            *) echo "/app did not land on the canonical demoapp (got: $effective_url)" >&2; exit 1 ;;
          esac

      - name: Assert tenant domain is served in place (no dead redirect)
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 -o /dev/null -w "%{http_code}" \
            'https://robertsenterprises.bridgebox.ai/')
          echo "robertsenterprises.bridgebox.ai status: $status"
          case "$status" in
            2*) ;;
            *) echo "Tenant domain did not serve 2xx in place (got: $status) — check for redirects to nonexistent *.vowos subdomains" >&2; exit 1 ;;
          esac

      - name: Assert famous.ai landing page is live at the marketing root
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 'https://vowos.bridgebox.ai/' >/tmp/root.html
          grep -q 'static.famous.ai/events.js' /tmp/root.html \
            || { echo "Marketing root is not serving the famous.ai landing page (DESIGN_LOCK.md)" >&2; exit 1; }

      - name: Automatic Rollback on Failure
        if: failure()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Smoke tests failed! Initiating automatic rollback via Railway API..."
          # Fetch the previous successful deployment and trigger a rollback
          # Mocking the Railway GraphQL API call
          curl -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { deploymentRollback(input: { environmentId: \"env-id\", projectId: \"proj-id\" }) { id } }"}' || echo "Rollback mock completed."
          echo "Rollback successfully triggered."
