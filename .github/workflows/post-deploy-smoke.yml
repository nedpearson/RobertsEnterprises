name: VowOS Post-Deploy Smoke

on:
  deployment_status:

permissions:
  contents: read

jobs:
  production-smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Roberts Enterprise / production'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify unified readiness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 https://vowos.bridgebox.ai/api/health/unified >/tmp/health.json
          cat /tmp/health.json

      - name: Verify Roberts worker API health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 https://api.robertsenterprises.bridgebox.ai/api/health >/tmp/roberts-health.json
          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/roberts-health.json', 'utf8'));
          if (health.status !== 'ok' || health.service !== 'vowos-worker') {
            console.error('Roberts worker health payload is not ready:', health);
            process.exit(1);
          }
          console.log('Roberts worker API healthy.');
          NODE

      - name: Verify all Roberts appointment store mappings
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 https://api.robertsenterprises.bridgebox.ai/api/scheduling/public/stores >/tmp/stores.json
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/stores.json', 'utf8'));
          const required = ['ido-br', 'ido-cov', 'pc-br', 'pc-cov'];
          const failures = required.filter((key) => payload?.stores?.[key]?.ok !== true);
          if (payload?.ready !== true || failures.length) {
            console.error('Appointment intake mapping is NOT production ready:', JSON.stringify(payload, null, 2));
            process.exit(1);
          }
          for (const key of required) {
            const store = payload.stores[key];
            if (!store.business || !store.location) {
              console.error(`Appointment store ${key} resolved without a business/location:`, store);
              process.exit(1);
            }
          }
          console.log('All four Roberts appointment store mappings resolve deterministically.');
          NODE

      - name: Verify appointment endpoint is live without creating data
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            --max-time 15 -o /tmp/booking-validation.json -w "%{http_code}" \
            -X POST -H 'Content-Type: application/json' \
            -d '{}' \
            'https://api.robertsenterprises.bridgebox.ai/api/scheduling/public/book')
          cat /tmp/booking-validation.json
          test "$status" = "400" || { echo "Expected booking validation 400, got $status" >&2; exit 1; }

      - name: Verify Shopify OAuth configuration
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 https://api.robertsenterprises.bridgebox.ai/api/shopify/setup/status >/tmp/shopify.json
          node - <<'NODE'
          const fs = require('fs');
          const setup = JSON.parse(fs.readFileSync('/tmp/shopify.json', 'utf8'));
          if (setup.ready !== true || setup.redirectUriValid !== true) {
            console.error('Shopify OAuth setup is not production ready:', JSON.stringify(setup, null, 2));
            process.exit(1);
          }
          console.log('Shopify OAuth configuration ready.');
          NODE

      - name: Verify VowOS public website
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 --output /dev/null 'https://vowos.bridgebox.ai/'

      - name: Verify guided demo route
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 --output /dev/null 'https://vowos.bridgebox.ai/demo'

      - name: Verify full anonymous demo app route
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 --output /dev/null 'https://vowos.bridgebox.ai/demoapp'

      - name: Verify platform route
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 --output /dev/null 'https://vowos.bridgebox.ai/platform'

      - name: Assert guided demo remains on the canonical public origin
        run: |
          set -euo pipefail
          effective_url=$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 --location --output /dev/null --write-out '%{url_effective}' \
            'https://vowos.bridgebox.ai/demo')
          echo "Effective guided demo URL: $effective_url"
          case "$effective_url" in
            https://vowos.bridgebox.ai/demo*) ;;
            *) echo "Guided demo escaped canonical VowOS URL" >&2; exit 1 ;;
          esac

      # /demoapp is served on the canonical origin. It must NOT redirect to any
      # *.vowos.bridgebox.ai subdomain — no DNS exists there (NXDOMAIN), which is
      # exactly how the live demo went dark in August 2026.
      - name: Assert live demo app is served on the canonical origin
        run: |
          set -euo pipefail
          effective_url=$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 --location --output /dev/null --write-out '%{url_effective}' \
            'https://vowos.bridgebox.ai/demoapp')
          echo "Effective demoapp URL: $effective_url"
          case "$effective_url" in
            https://vowos.bridgebox.ai/demoapp*) ;;
            *) echo "Live demo app left the canonical origin (got: $effective_url)" >&2; exit 1 ;;
          esac

      - name: Assert public app alias enters demoapp on the canonical origin
        run: |
          set -euo pipefail
          effective_url=$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 --location --output /dev/null --write-out '%{url_effective}' \
            'https://vowos.bridgebox.ai/app')
          echo "Effective /app URL: $effective_url"
          case "$effective_url" in
            https://vowos.bridgebox.ai/demoapp*) ;;
            *) echo "/app did not land on the canonical demoapp (got: $effective_url)" >&2; exit 1 ;;
          esac

      - name: Assert tenant domain is served in place (no dead redirect)
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 -o /dev/null -w "%{http_code}" \
            'https://robertsenterprises.bridgebox.ai/')
          echo "robertsenterprises.bridgebox.ai status: $status"
          case "$status" in
            2*) ;;
            *) echo "Tenant domain did not serve 2xx in place (got: $status) — check for redirects to nonexistent *.vowos subdomains" >&2; exit 1 ;;
          esac

      - name: Assert famous.ai landing page is live at the marketing root
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            --max-time 15 'https://vowos.bridgebox.ai/' >/tmp/root.html
          grep -q 'static.famous.ai/events.js' /tmp/root.html \
            || { echo "Marketing root is not serving the famous.ai landing page (DESIGN_LOCK.md)" >&2; exit 1; }

      - name: Fail visibly if post-deploy smoke fails
        if: failure()
        run: |
          echo "Production smoke failed. No fake rollback is being reported."
          echo "The failed deployment must remain blocked/actionable until Railway rollback credentials and concrete project/environment IDs are configured."
          exit 1
